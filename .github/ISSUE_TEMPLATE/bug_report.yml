name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Consigna version
      description: Output of `consigna --version`
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices and browsers
      description: e.g. host on macOS 15, phone iPhone 16 with Safari 18
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `--log-level debug` and paste the relevant part. Remove anything private.
      render: text
